spring.application.name=expensetrackerapp

# Server
# server.address=0.0.0.0
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# MongoDB (Spring Boot 4 uses spring.mongodb.*, NOT spring.data.mongodb.uri)
# MONGODB_URI: full connection string (Atlas: mongodb+srv://...). Never commit real values.
# MONGODB_DATABASE: wins over any database name in the URI path.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/finpulse}
spring.mongodb.database=${MONGODB_DATABASE:finpulse}
spring.data.mongodb.auto-index-creation=true

# GridFS: the Python worker must use the SAME bucket name
application.gridfs.bucket=${GRIDFS_BUCKET:fs}

# Upload limits (MAX_FILE_SIZE examples: 10MB, 5MB, 2048KB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:11MB}

# Processing jobs (retry/lease behaviour; the Python worker has its own JOB_LEASE_SECONDS / MAX_JOB_ATTEMPTS)
application.jobs.max-attempts=${JOB_MAX_ATTEMPTS:3}
application.jobs.lease-seconds=${JOB_LEASE_SECONDS:300}
application.jobs.backoff-base-seconds=${JOB_BACKOFF_BASE_SECONDS:30}
application.jobs.backoff-max-seconds=${JOB_BACKOFF_MAX_SECONDS:3600}

# Dashboard
application.dashboard.currency=${DASHBOARD_CURRENCY:INR}
application.dashboard.zone=${DASHBOARD_ZONE:Asia/Kolkata}
application.dashboard.recent-count=${DASHBOARD_RECENT_COUNT:5}

# JWT
# MUST be set via the JWT_SECRET environment variable. No hardcoded default permitted.
application.jwt.secret=${JWT_SECRET:}
# Milliseconds. JWT_EXPIRATION_MS is the existing name; JWT_EXPIRATION is accepted as an alias.
application.jwt.expiration-ms=${JWT_EXPIRATION_MS:${JWT_EXPIRATION:86400000}}
application.jwt.issuer=${JWT_ISSUER:expensetrackerapp}

# Login brute-force protection (per e-mail, in memory)
application.security.login-max-failures=${LOGIN_MAX_FAILURES:5}
application.security.login-lockout-minutes=${LOGIN_LOCKOUT_MINUTES:15}

# Never reveal internals in error responses (Spring's defaults, stated explicitly)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# CORS
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:19006}

# Health checks (only health is exposed; no details to anonymous callers)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Logging (never log tokens, passwords or document contents)
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.in.expensetrackerapp=${LOG_LEVEL:INFO}
logging.level.org.mongodb.driver=${LOG_LEVEL_MONGO:WARN}

# Document status reconciler (fixes documents left in PROCESSING after their job finished)
application.documents.reconcile-interval-ms=${DOCUMENT_RECONCILE_INTERVAL_MS:60000}
application.documents.reconcile-initial-delay-ms=${DOCUMENT_RECONCILE_INITIAL_DELAY_MS:30000}

# Upload rate limit (per bearer token, per instance) and GridFS orphan sweep
application.uploads.max-per-window=${UPLOAD_MAX_PER_WINDOW:20}
application.uploads.window-seconds=${UPLOAD_WINDOW_SECONDS:60}
application.sweeper.gridfs-interval-ms=${GRIDFS_ORPHAN_SWEEP_INTERVAL_MS:3600000}

# Voice expenses via Gemini (key is NEVER committed; set GEMINI_API_KEY in the environment)
application.gemini.api-url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}
application.gemini.api-key=${GEMINI_API_KEY:}
application.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:30}
